apiVersion: v1
kind: Secret
metadata:
  name: symds
  namespace: default
type: Opaque
stringData:
  # Matches APP_USER / APP_USER_PASSWORD passed to the oracle-db pod in up.sh.
  # Dedicated schema, mirroring the real cluster's OPS$SITE07 rather than using SYSTEM.
  # The RESOURCE role the image grants covers what SymmetricDS needs
  # (CREATE TABLE / TRIGGER / SEQUENCE / PROCEDURE).
  # "ora" isn't one of Oracle's reserved/default account names (SYS, SYSTEM, OUTLN,
  # DBSNMP, CTXSYS, XDB, etc.), so it's safe to use as a plain APP_USER.
  oracle-db-username: ora
  oracle-db-password: ora
