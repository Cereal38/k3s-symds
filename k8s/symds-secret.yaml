apiVersion: v1
kind: Secret
metadata:
  name: symds
  namespace: default
type: Opaque
stringData:
  # Matches APP_USER / APP_USER_PASSWORD passed to the identity-ora pod in up.sh.
  # Dedicated schema, mirroring the real cluster's OPS$SITE07 rather than using SYSTEM.
  # The RESOURCE role the image grants covers what SymmetricDS needs
  # (CREATE TABLE / TRIGGER / SEQUENCE / PROCEDURE).
  oracle-db-username: identity
  oracle-db-password: identity
