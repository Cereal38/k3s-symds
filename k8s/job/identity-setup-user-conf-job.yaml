apiVersion: batch/v1
kind: Job
metadata:
  name: identity-setup-user-conf
  namespace: default
spec:
  template:
    spec:
      containers:
        - name: identity-setup-user-conf
          image: postgres:16-alpine
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              for f in /scripts/*.sql; do
                echo ">>> applying $f"
                psql -v ON_ERROR_STOP=1 -f "$f"
              done
          imagePullPolicy: Always
          resources:
            requests:
              memory: "128Mi"
              cpu: "500m"
              ephemeral-storage: "1Gi"
            limits:
              memory: "512Mi"
              cpu: "2"
              ephemeral-storage: "5Gi"
          volumeMounts:
            - name: sql
              mountPath: /scripts
              readOnly: true
          env:
            # psql reads all of these implicitly, so the args above need no flags.
            - name: PGHOST
              value: identity-pg-rw
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: identity
            # The superuser, not the identity app user: the scripts run CREATE ROLE
            # and ALTER DEFAULT PRIVILEGES FOR ROLE identity, neither of which the
            # app user is allowed to do. Provided by enableSuperuserAccess on the
            # CNPG cluster (see k8s/postgres-cluster.yaml).
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: identity-pg-superuser
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: identity-pg-superuser
                  key: password

      volumes:
        - name: sql
          configMap:
            name: identity-sql-script

      restartPolicy: Never
