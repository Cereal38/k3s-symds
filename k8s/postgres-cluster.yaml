apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: identity-db
  namespace: postgres-db
spec:
  instances: 1

  imageName: ghcr.io/cloudnative-pg/postgresql:15

  storage:
    size: 1Gi

  bootstrap:
    initdb:
      database: identity
      owner: identity

  enableSuperuserAccess: true
