apiVersion: apps/v1
kind: Deployment
metadata:
  name: symds-location
  namespace: default
  labels:
    app: symds-location
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: symds-location
  template:
    metadata:
      labels:
        app: symds-location
    spec:
      initContainers:
        # Inserts the sym_* sync configuration into the ROOT node's Oracle database.
        # Requires symds-oracle to be running first, so that the sym_* tables exist.
        - name: symds-location-flyway-migrate
          image: flyway/flyway:12.11
          args: [ "migrate" ]
          env:
            - name: FLYWAY_URL
              value: jdbc:oracle:thin:@//oracle-service:1521/FREEPDB1
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: symds
                  key: oracle-db-username
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: symds
                  key: oracle-db-password
            - name: FLYWAY_BASELINE_ON_MIGRATE
              value: "true"
            - name: FLYWAY_BASELINE_VERSION
              value: "0"
          volumeMounts:
            - mountPath: /flyway/sql
              name: symds-flyway-files
      containers:
        - name: symmetricds
          image: jumpmind/symmetricds:3.16
          ports:
            - containerPort: 31415
          env:
            # Credentials generated by CloudNativePG for the location-pg cluster.
            - name: SYMDS_LOCATION_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: location-pg-app
                  key: username
            - name: SYMDS_LOCATION_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: location-pg-app
                  key: password
          volumeMounts:
            - name: engine-config
              mountPath: /opt/symmetric-ds/engines
          readinessProbe:
            httpGet:
              path: /sync/ping
              port: 31415
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /sync/ping
              port: 31415
            initialDelaySeconds: 40
            periodSeconds: 30
      volumes:
        - name: engine-config
          configMap:
            name: location-pg-engine-config
        - name: symds-flyway-files
          configMap:
            name: symds-flyway-files
