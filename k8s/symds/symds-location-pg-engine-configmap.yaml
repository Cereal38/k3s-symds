apiVersion: v1
kind: ConfigMap
metadata:
  name: location-pg-engine-config
  namespace: default
data:
  location-001.properties: |
    engine.name=location-002

    db.driver=org.postgresql.Driver
    db.url=jdbc:postgresql://location-pg-rw:5432/location?currentSchema=symds_location&stringtype=unspecified
    # CloudNativePG generates a random password for the location user, so these
    # have to come from the location-pg-app secret via the deployment's env.
    db.user=$(SYMDS_LOCATION_DB_USERNAME)
    db.password=$(SYMDS_LOCATION_DB_PASSWORD)
    db.validation.query=select 1

    registration.url=http://symds-oracle:31415/sync/oracle-000
    sync.url=http://symds-location:31415/sync/location-002
    group.id=location
    external.id=002

    # How often to run routing (in millis), which puts changes into batches.
    job.routing.period.time.ms=1000

    # How often to run push (in millis), which sends changes to other nodes.
    job.push.period.time.ms=2000

    # How often to run pull (in millis), which receives changes from other nodes.
    job.pull.period.time.ms=2000

    # auto.registration and auto.reload are registration-server parameters and are
    # set on oracle-000. This node is a client, so they would have no effect here.

