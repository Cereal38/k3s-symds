apiVersion: v1
kind: ConfigMap
metadata:
  name: oracle-engine-config
  namespace: default
data:
  oracle-000.properties: |
    engine.name=oracle-000

    db.driver=oracle.jdbc.driver.OracleDriver
    # Service-name form (@//host:port/service), not the SID form used against the
    # real cluster: FREEPDB1 is a PDB service, not a SID.
    db.url=jdbc:oracle:thin:@//oracle-service:1521/FREEPDB1
    db.user=$(SYMDS_ORACLE_DB_USERNAME)
    db.password=$(SYMDS_ORACLE_DB_PASSWORD)
    db.validation.query=select 1 from dual

    # Blank registration.url marks this node as the registration server (root node).
    registration.url=
    sync.url=http://symds-oracle:31415/sync/oracle-000
    group.id=oracle
    external.id=000

    # When this node sends an initial load of data to another node, first send table create scripts.
    initial.load.create.first=true
    create.table.without.foreign.keys=true
    #initial.load.before.sql=call public.before_initial_load()
    #initial.load.after.sql=call public.after_initial_load()

    # How often to run routing (in millis), which puts changes into batches.
    job.routing.period.time.ms=5000

    # How often to run push (in millis), which sends changes to other nodes.
    job.push.period.time.ms=10000

    #How often to run pull (in millis), which receives changes from other nodes.
    job.pull.period.time.ms=10000

    # Automatically register new nodes when they request it.
    # If this is false, accept the registration requests using "symadmin open-registration" command.
    auto.registration=true
    auto.reload=true

