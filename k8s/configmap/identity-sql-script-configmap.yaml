apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-sql-script
  namespace: default
data:
  00_setup_user_config.sql: |
    -- Create role and schema for postgres tables
    -- All of this run as postgres superuser
    -- It must be idempotent since it can run multiple times
        
    -- Create the role identity_app
    DO $$
      BEGIN
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'identity_app') THEN
          CREATE ROLE identity_app LOGIN PASSWORD 'identity_app';
        END IF;
      END
    $$;
  
    -- Create schema identity_app and allow it to connect to the identity dabase
    CREATE SCHEMA IF NOT EXISTS identity_app AUTHORIZATION identity_app;
    GRANT CONNECT ON DATABASE identity TO identity_app;
    
    -- Give access to identity_app to the symds schema (for everything created before this script)
    GRANT USAGE ON SCHEMA symds_identity TO identity_app;
    GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA symds_identity TO identity_app;
    GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA symds_identity TO identity_app;
        
    -- Give access to identity_app to the symds schema (for everything created after this script)
    ALTER DEFAULT PRIVILEGES FOR ROLE identity IN SCHEMA symds_identity
        GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO identity_app;
    ALTER DEFAULT PRIVILEGES FOR ROLE identity IN SCHEMA symds_identity
        GRANT USAGE, SELECT ON SEQUENCES TO identity_app;

  01_create_id_doc_type.sql: |
    
    create table if not exists identity_app.id_doc_type
    (
        type_doc_id_no
        numeric
    (
        5
    ) PRIMARY KEY,
        type_doc_id_code text NOT NULL,
        type_doc_id_lib text NOT NULL,
        type_doc_id_lib_en text NOT NULL,
        type_doc_id_visible text NOT NULL DEFAULT 'Y'
        );
        
    ALTER TABLE identity_app.id_doc_type OWNER TO identity_app;

  02_setup_identity_triggers.sql: |

    DROP TRIGGER IF EXISTS trg_sync_type_document_identite ON symds_identity.type_document_identite;

    CREATE
    OR REPLACE FUNCTION identity_app.sync_type_document_identite()
    RETURNS trigger
    LANGUAGE plpgsql
    SECURITY DEFINER
    SET search_path = identity_app, pg_catalog
    AS $$
    BEGIN
        /*
         * Loop guard: the peer trigger sets this flag while it is
         * propagating a row, so we must not propagate it back.
         */
        IF
    coalesce(current_setting('symds.sync_in_progress', true), 'off') = 'on' THEN
            IF TG_OP = 'DELETE' THEN RETURN OLD;
    ELSE RETURN NEW;
    END IF;
    END IF;

        PERFORM
    set_config('symds.sync_in_progress', 'on', true);  -- transaction-local

        IF
    TG_OP = 'DELETE' THEN
    DELETE
    FROM identity_app.id_doc_type
    WHERE type_doc_id_no = OLD.type_doc_id_no;
    
    PERFORM
    set_config('symds.sync_in_progress', 'off', true);
    RETURN OLD;
    END IF;

        IF
    TG_OP = 'UPDATE' THEN
    UPDATE identity_app.id_doc_type
    SET type_doc_id_no      = NEW.type_doc_id_no,
        type_doc_id_code    = NEW.type_doc_id_code,
        type_doc_id_lib     = NEW.type_doc_id_lib,
        type_doc_id_lib_en  = NEW.type_doc_id_lib_en,
        type_doc_id_visible = NEW.type_doc_id_visible
    WHERE type_doc_id_no = OLD.type_doc_id_no;
    
    IF
    NOT FOUND THEN
                INSERT INTO identity_app.id_doc_type (
                    type_doc_id_no, type_doc_id_code, type_doc_id_lib,
                    type_doc_id_lib_en, type_doc_id_visible)
                VALUES (NEW.type_doc_id_no, NEW.type_doc_id_code, NEW.type_doc_id_lib,
                        NEW.type_doc_id_lib_en, NEW.type_doc_id_visible);
    END IF;

            PERFORM
    set_config('symds.sync_in_progress', 'off', true);
    RETURN NEW;
    END IF;

        -- TG_OP = 'INSERT'
    INSERT INTO identity_app.id_doc_type (type_doc_id_no, type_doc_id_code, type_doc_id_lib,
                                       type_doc_id_lib_en, type_doc_id_visible)
    VALUES (NEW.type_doc_id_no, NEW.type_doc_id_code, NEW.type_doc_id_lib,
            NEW.type_doc_id_lib_en, NEW.type_doc_id_visible);
    
    PERFORM
    set_config('symds.sync_in_progress', 'off', true);
    RETURN NEW;
    END;
    $$;

    ALTER FUNCTION identity_app.sync_type_document_identite()
        OWNER TO identity_app;

    CREATE TRIGGER trg_sync_type_document_identite
        AFTER INSERT OR
    UPDATE OR
    DELETE
    ON symds_identity.type_document_identite
        FOR EACH ROW
        EXECUTE FUNCTION identity_app.sync_type_document_identite();

  03_setup_identity_reverse_triggers.sql: |

    DROP TRIGGER IF EXISTS trg_sync_id_doc_type ON identity_app.id_doc_type;

    CREATE
    OR REPLACE FUNCTION identity_app.sync_id_doc_type()
    RETURNS trigger
    LANGUAGE plpgsql
    SECURITY DEFINER
    SET search_path = identity_app, pg_catalog
    AS $$
    BEGIN
        /*
         * Loop guard: the peer trigger sets this flag while it is
         * propagating a row, so we must not propagate it back.
         */
        IF
    coalesce(current_setting('symds.sync_in_progress', true), 'off') = 'on' THEN
            IF TG_OP = 'DELETE' THEN RETURN OLD;
    ELSE RETURN NEW;
    END IF;
    END IF;

        PERFORM
    set_config('symds.sync_in_progress', 'on', true);  -- transaction-local

        IF
    TG_OP = 'DELETE' THEN
    DELETE
    FROM symds_identity.type_document_identite
    WHERE type_doc_id_no = OLD.type_doc_id_no;
    
    PERFORM
    set_config('symds.sync_in_progress', 'off', true);
    RETURN OLD;
    END IF;

        IF
    TG_OP = 'UPDATE' THEN
    UPDATE symds_identity.type_document_identite
    SET type_doc_id_no      = NEW.type_doc_id_no,
        type_doc_id_code    = NEW.type_doc_id_code,
        type_doc_id_lib     = NEW.type_doc_id_lib,
        type_doc_id_lib_en  = NEW.type_doc_id_lib_en,
        type_doc_id_visible = NEW.type_doc_id_visible
    WHERE type_doc_id_no = OLD.type_doc_id_no;
    
    IF
    NOT FOUND THEN
                INSERT INTO symds_identity.type_document_identite (
                    type_doc_id_no, type_doc_id_code, type_doc_id_lib,
                    type_doc_id_lib_en, type_doc_id_visible)
                VALUES (NEW.type_doc_id_no, NEW.type_doc_id_code, NEW.type_doc_id_lib,
                        NEW.type_doc_id_lib_en, NEW.type_doc_id_visible);
    END IF;

            PERFORM
    set_config('symds.sync_in_progress', 'off', true);
    RETURN NEW;
    END IF;

        -- TG_OP = 'INSERT'
    INSERT INTO symds_identity.type_document_identite (type_doc_id_no, type_doc_id_code, type_doc_id_lib,
                                                       type_doc_id_lib_en, type_doc_id_visible)
    VALUES (NEW.type_doc_id_no, NEW.type_doc_id_code, NEW.type_doc_id_lib,
            NEW.type_doc_id_lib_en, NEW.type_doc_id_visible);
    
    PERFORM
    set_config('symds.sync_in_progress', 'off', true);
    RETURN NEW;
    END;
    $$;

    ALTER FUNCTION identity_app.sync_id_doc_type() OWNER TO identity_app;

    CREATE TRIGGER trg_sync_id_doc_type
        AFTER INSERT OR
    UPDATE OR
    DELETE
    ON identity_app.id_doc_type
        FOR EACH ROW
        EXECUTE FUNCTION identity_app.sync_id_doc_type();