apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-sql-script
  namespace: default
data:
  00_setup_user_config.sql: |
    DO $$
      BEGIN
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'identity2') THEN
          CREATE ROLE identity2 LOGIN PASSWORD 'identity2';
        END IF;
      END
    $$;
  
    CREATE SCHEMA IF NOT EXISTS identity2 AUTHORIZATION identity2;

    GRANT CONNECT ON DATABASE identity TO identity2;
    
    GRANT USAGE, CREATE ON SCHEMA identity2 TO identity2;
    GRANT USAGE ON SCHEMA symds_identity TO identity2;
    GRANT SELECT ON ALL TABLES IN SCHEMA symds_identity TO identity2;
    GRANT TRIGGER ON ALL TABLES IN SCHEMA symds_identity TO identity2;
    ALTER DEFAULT PRIVILEGES FOR ROLE identity IN SCHEMA symds_identity GRANT SELECT ON TABLES TO identity2;
    ALTER DEFAULT PRIVILEGES FOR ROLE identity IN SCHEMA symds_identity GRANT USAGE, SELECT ON SEQUENCES TO identity2;
    ALTER DEFAULT PRIVILEGES FOR ROLE identity IN SCHEMA symds_identity GRANT TRIGGER ON TABLES TO identity2;

    GRANT INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA identity2 TO identity;
    GRANT TRIGGER ON ALL TABLES IN SCHEMA identity2 TO identity;
  

  01_create_id_doc_type.sql: |
    
    create table if not exists identity2.id_doc_type
    (
        type_doc_id_no
        numeric
    (
        5
    ) PRIMARY KEY,
        type_doc_id_code text NOT NULL,
        type_doc_id_lib text NOT NULL,
        type_doc_id_lib_en text NOT NULL,
        type_doc_id_visible text NOT NULL DEFAULT 'Y'
        );
        
    ALTER TABLE identity2.id_doc_type OWNER TO identity2;
    --GRANT INSERT ON ALL TABLES IN SCHEMA identity2 TO symds_identity;

  02_setup_identity_triggers.sql: |

    DROP TRIGGER IF EXISTS trg_sync_type_document_identite ON symds_identity.type_document_identite;
    
    CREATE OR REPLACE FUNCTION identity2.sync_type_document_identite()
    RETURNS trigger
    LANGUAGE plpgsql
    SECURITY DEFINER
    SET search_path = identity2, pg_catalog
    AS $$
    BEGIN
    IF
    TG_OP = 'DELETE' THEN
    DELETE
    FROM identity2.id_doc_type
    WHERE type_doc_id_no = OLD.type_doc_id_no;
    RETURN OLD;
    END IF;
    
    INSERT INTO identity2.id_doc_type (type_doc_id_no, type_doc_id_code, type_doc_id_lib, type_doc_id_lib_en,
                                       type_doc_id_visible)
    VALUES (NEW.type_doc_id_no, NEW.type_doc_id_code, NEW.type_doc_id_lib, NEW.type_doc_id_lib_en,
            NEW.type_doc_id_visible) ON CONFLICT (type_doc_id_no) DO
    UPDATE
        SET type_doc_id_code = EXCLUDED.type_doc_id_code,
        type_doc_id_lib = EXCLUDED.type_doc_id_lib,
        type_doc_id_lib_en = EXCLUDED.type_doc_id_lib_en,
        type_doc_id_visible = EXCLUDED.type_doc_id_visible;
    
    RETURN NEW;
    END;
    $$;

    ALTER FUNCTION identity2.sync_type_document_identite()
        OWNER TO identity2;
    
    CREATE TRIGGER trg_sync_type_document_identite
        AFTER INSERT OR
    UPDATE OR
    DELETE
    ON symds_identity.type_document_identite
        FOR EACH ROW EXECUTE FUNCTION identity2.sync_type_document_identite();
