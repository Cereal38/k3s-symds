apiVersion: v1
kind: ConfigMap
metadata:
  name: location-sql-script
  namespace: default
data:
  00_check_db_ready.sql: |
    \set ON_ERROR_STOP on
    
    -- ============================================================
    -- Generic wait helper (session-local, disappears on disconnect)
    -- ============================================================
    CREATE
        OR REPLACE FUNCTION pg_temp.wait_until(
        p_label text,
        p_condition_sql text,
        p_timeout_secs int DEFAULT 300,
        p_poll_secs numeric DEFAULT 2
    ) RETURNS void AS
    $fn$
    DECLARE
        v_deadline timestamptz := clock_timestamp()
            + make_interval(secs => p_timeout_secs);
        v_ok
                   boolean;
        v_last_state
                   text        := 'condition stayed false';
        v_waited
                   numeric     := 0;
        v_next_msg
                   numeric     := 30;
    BEGIN
        LOOP
            BEGIN
                EXECUTE 'SELECT coalesce((' || p_condition_sql || '), false)' INTO v_ok;
                v_last_state
                    := 'condition stayed false';
            EXCEPTION
                WHEN OTHERS THEN
                    -- object not created yet, etc. -> just "not ready"
                    v_ok := false;
                    v_last_state
                        := SQLERRM;
            END;
            
            IF
                v_ok THEN
                RAISE NOTICE '  OK   %  (after % s)', p_label, round(v_waited, 1);
                RETURN;
            END IF;
            
            IF
                clock_timestamp() > v_deadline THEN
                RAISE EXCEPTION 'Timed out after % s waiting for: %  [last state: %]',
                    p_timeout_secs, p_label, v_last_state;
            END IF;
            
            IF
                v_waited >= v_next_msg THEN
                RAISE NOTICE '  ...  still waiting for % (% s elapsed)',
                    p_label, round(v_waited, 0);
                v_next_msg
                    := v_next_msg + 30;
            END IF;
            
            PERFORM
                pg_sleep(p_poll_secs);
            v_waited
                := v_waited + p_poll_secs;
        END LOOP;
    END
    $fn$
        LANGUAGE plpgsql;
    
    -- ============================================================
    -- 1. schema symds_location
    -- ============================================================
    SELECT pg_temp.wait_until(
                   '[1/6] schema symds_location',
                   $$ EXISTS (SELECT 1 FROM pg_namespace WHERE nspname = 'symds_location') $$,
                   600);
    
    -- ============================================================
    -- 2. table symds_location.sym_node_security
    -- ============================================================
    SELECT pg_temp.wait_until(
                   '[2/6] symds_location.sym_node_security',
                   $$ to_regclass('symds_location.sym_node_security') IS NOT NULL $$,
                   600);
    
    -- ============================================================
    -- 3. initial_load_end_time IS NOT NULL
    --    (row may not exist yet: node not registered -> "not ready")
    -- ============================================================
    SELECT pg_temp.wait_until(
                   '[3/6] initial load finished',
                   $$ EXISTS (SELECT 1 FROM symds_location.sym_node_security
      WHERE node_id = '002'
      AND initial_load_end_time IS NOT NULL) $$,
                   3600, 5);
    
    -- non-fatal diagnostic
    DO
    $$
        DECLARE
            v_err int;
        BEGIN
            IF
                to_regclass('symds_location.sym_incoming_batch') IS NOT NULL THEN
                SELECT count(*)
                INTO v_err
                FROM symds_location.sym_incoming_batch
                WHERE status = 'ER';
                IF
                    v_err > 0 THEN
                    RAISE WARNING 'initial load ended but % incoming batch(es) in ER', v_err;
                END IF;
            END IF;
        END
    $$;
    
    -- ============================================================
    -- 4. role location
    -- ============================================================
    SELECT pg_temp.wait_until(
                   '[4/6] role location',
                   $$ EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'location') $$,
                   300);
    
    -- ============================================================
    -- 5. expected tables under symds_location
    -- ============================================================
    SELECT pg_temp.wait_until(
                   '[5/6] table symds_location.fr_cities',
                   $$ NOT EXISTS (
      SELECT 1 FROM unnest(ARRAY['fr_cities']) AS t(name)
      WHERE to_regclass('symds_location.' || quote_ident(t.name)) IS NULL) $$,
                   600);
    
    -- ============================================================
    -- 6. those tables owned by role location
    -- ============================================================
    SELECT pg_temp.wait_until(
                   '[6/6] fr_cities owned by location',
                   $$ NOT EXISTS (
      SELECT 1
      FROM unnest(ARRAY['fr_cities']) AS t(name)
      JOIN pg_class     c ON c.relname = t.name
      JOIN pg_namespace n ON n.oid = c.relnamespace
      WHERE n.nspname = 'symds_location'
      AND pg_get_userbyid(c.relowner) <> 'location') $$,
                   600);
    
    DO
    $$
        BEGIN
            RAISE
                NOTICE 'All preconditions satisfied.';
        END
    $$;
    
    -- ============================================================
    -- Everything below runs only once all six checks passed
    -- ============================================================
    -- CREATE TRIGGER ...

  01_setup_user_config.sql: |
    -- Create the role location_app
    DO
    $$
        BEGIN
            IF
                NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'location_app') THEN
                CREATE ROLE location_app LOGIN PASSWORD 'location_app';
            END IF;
        END
    $$;
    
    
    -- Create schema location_app and allow it to connect to the location dabase
    CREATE SCHEMA IF NOT EXISTS location_app AUTHORIZATION location_app;
    GRANT
        CONNECT
        ON DATABASE location TO location_app;
    
    -- Give access to location_app to the symds schema (for everything created before this script)
    GRANT USAGE ON SCHEMA
        symds_location TO location_app;
    GRANT
        SELECT,
        INSERT,
        UPDATE,
        DELETE
        ON ALL TABLES IN SCHEMA symds_location TO location_app;
    GRANT
        USAGE,
        SELECT
        ON ALL SEQUENCES IN SCHEMA symds_location TO location_app;
    
    -- Give access to location_app to the symds schema (for everything created after this script)
    ALTER
        DEFAULT PRIVILEGES FOR ROLE location IN SCHEMA symds_location
        GRANT
        SELECT,
        INSERT
        ,
        UPDATE,
        DELETE
        ON TABLES TO location_app;
    ALTER
        DEFAULT PRIVILEGES FOR ROLE location IN SCHEMA symds_location
        GRANT USAGE,
        SELECT
        ON SEQUENCES TO location_app;

  02_create_fr_cities.sql: |
    
    CREATE TABLE IF NOT EXISTS location_app.fr_cities (
      id BIGINT PRIMARY KEY,
      region_code VARCHAR(10),
      dept_code VARCHAR(10),
      arrond_code VARCHAR(10),
      insee_code VARCHAR(10),
      alt_names VARCHAR(2000),
      name_ascii VARCHAR(200),
      country_code VARCHAR(2),
      geoname_id BIGINT,
      latitude NUMERIC(9, 6),
      longitude NUMERIC(9, 6),
      name VARCHAR(200),
      population INTEGER
    );
        
    ALTER TABLE location_app.fr_cities OWNER TO location_app;

  03_sync_fr_cities_symds_to_app.sql: |

    DROP TRIGGER IF EXISTS trg_sync_fr_cities_symds_to_app ON symds_location.fr_cities;

    CREATE
    OR REPLACE FUNCTION location_app.sync_fr_cities_symds_to_app()
    RETURNS trigger
    LANGUAGE plpgsql
    SECURITY DEFINER
    SET search_path = location_app, pg_catalog
    AS $$
    BEGIN
        /*
         * Loop guard: the peer trigger sets this flag while it is
         * propagating a row, so we must not propagate it back.
         */
        IF
    coalesce(current_setting('symds.sync_in_progress', true), 'off') = 'on' THEN
            IF TG_OP = 'DELETE' THEN RETURN OLD;
    ELSE RETURN NEW;
    END IF;
    END IF;

        PERFORM
    set_config('symds.sync_in_progress', 'on', true);  -- transaction-local

        IF
    TG_OP = 'DELETE' THEN
    DELETE
    FROM location_app.fr_cities
    WHERE id = OLD.id;
    
    PERFORM
    set_config('symds.sync_in_progress', 'off', true);
    RETURN OLD;
    END IF;

        IF
    TG_OP = 'UPDATE' THEN
    UPDATE location_app.fr_cities
    SET 
        region_code = NEW.region_code,
        dept_code = NEW.dept_code,
        arrond_code = NEW.arrond_code,
        insee_code = NEW.insee_code,
        alt_names = NEW.alt_names,
        name_ascii = NEW.name_ascii,
        country_code = NEW.country_code,
        geoname_id = NEW.geoname_id,
        latitude = NEW.latitude,
        longitude = NEW.longitude,
        name = NEW.name,
        population = NEW.population
    WHERE id = OLD.id;
    
    IF
    NOT FOUND THEN
                INSERT INTO location_app.fr_cities (
                    id, region_code, dept_code, arrond_code, insee_code, alt_names, name_ascii, country_code, geoname_id, latitude, longitude, name, population)
                VALUES (NEW.id, NEW.region_code, NEW.dept_code, NEW.arrond_code, NEW.insee_code, NEW.alt_names, NEW.name_ascii, NEW.country_code, NEW.geoname_id, NEW.latitude, NEW.longitude, NEW.name, NEW.population);
    END IF;

            PERFORM
    set_config('symds.sync_in_progress', 'off', true);
    RETURN NEW;
    END IF;

        -- TG_OP = 'INSERT'
    INSERT INTO location_app.fr_cities (id, region_code, dept_code, arrond_code, insee_code, alt_names, name_ascii, country_code, geoname_id, latitude, longitude, name, population)
    VALUES (NEW.id, NEW.region_code, NEW.dept_code, NEW.arrond_code, NEW.insee_code, NEW.alt_names, NEW.name_ascii, NEW.country_code, NEW.geoname_id, NEW.latitude, NEW.longitude, NEW.name, NEW.population);
    
    PERFORM
    set_config('symds.sync_in_progress', 'off', true);
    RETURN NEW;
    END;
    $$;

    ALTER FUNCTION location_app.sync_fr_cities_symds_to_app()
        OWNER TO location_app;

    CREATE TRIGGER trg_sync_fr_cities_symds_to_app
        AFTER INSERT OR
    UPDATE OR
    DELETE
    ON symds_location.fr_cities
        FOR EACH ROW
        EXECUTE FUNCTION location_app.sync_fr_cities_symds_to_app();

    SELECT COUNT(*) as number_of_cities FROM symds_location.fr_cities

  04_sync_fr_cities_app_to_symds.sql: |

    DROP TRIGGER IF EXISTS trg_sync_fr_cities_app_to_symds ON location_app.fr_cities;

    CREATE
    OR REPLACE FUNCTION location_app.sync_fr_cities_app_to_symds()
    RETURNS trigger
    LANGUAGE plpgsql
    SECURITY DEFINER
    SET search_path = location_app, pg_catalog
    AS $$
    BEGIN
        /*
         * Loop guard: the peer trigger sets this flag while it is
         * propagating a row, so we must not propagate it back.
         */
        IF
    coalesce(current_setting('symds.sync_in_progress', true), 'off') = 'on' THEN
            IF TG_OP = 'DELETE' THEN RETURN OLD;
    ELSE RETURN NEW;
    END IF;
    END IF;

        PERFORM
    set_config('symds.sync_in_progress', 'on', true);  -- transaction-local

        IF
    TG_OP = 'DELETE' THEN
    DELETE
    FROM symds_location.fr_cities
    WHERE id = OLD.id;
    
    PERFORM
    set_config('symds.sync_in_progress', 'off', true);
    RETURN OLD;
    END IF;

        IF
    TG_OP = 'UPDATE' THEN
    UPDATE symds_location.fr_cities
    SET region_code = NEW.region_code,
        dept_code = NEW.dept_code,
        arrond_code = NEW.arrond_code,
        insee_code = NEW.insee_code,
        alt_names = NEW.alt_names,
        name_ascii = NEW.name_ascii,
        country_code = NEW.country_code,
        geoname_id = NEW.geoname_id,
        latitude = NEW.latitude,
        longitude = NEW.longitude,
        name = NEW.name,
        population = NEW.population
    WHERE id = OLD.id;
    
    IF
    NOT FOUND THEN
                INSERT INTO symds_location.fr_cities (
                    id, region_code, dept_code, arrond_code, insee_code, alt_names, name_ascii, country_code, geoname_id, latitude, longitude, name, population)
                VALUES (NEW.id, NEW.region_code, NEW.dept_code, NEW.arrond_code, NEW.insee_code, NEW.alt_names, NEW.name_ascii, NEW.country_code, NEW.geoname_id, NEW.latitude, NEW.longitude, NEW.name, NEW.population);
    END IF;

            PERFORM
    set_config('symds.sync_in_progress', 'off', true);
    RETURN NEW;
    END IF;

        -- TG_OP = 'INSERT'
    INSERT INTO symds_location.fr_cities (id, region_code, dept_code, arrond_code, insee_code, alt_names, name_ascii, country_code, geoname_id, latitude, longitude, name, population)
    VALUES (NEW.id, NEW.region_code, NEW.dept_code, NEW.arrond_code, NEW.insee_code, NEW.alt_names, NEW.name_ascii, NEW.country_code, NEW.geoname_id, NEW.latitude, NEW.longitude, NEW.name, NEW.population);
    
    PERFORM
    set_config('symds.sync_in_progress', 'off', true);
    RETURN NEW;
    END;
    $$;

    ALTER FUNCTION location_app.sync_fr_cities_app_to_symds() OWNER TO location_app;

    CREATE TRIGGER trg_sync_fr_cities_app_to_symds
        AFTER INSERT OR
    UPDATE OR
    DELETE
    ON location_app.fr_cities
        FOR EACH ROW
        EXECUTE FUNCTION location_app.sync_fr_cities_app_to_symds();

  05_insert_all_fr_cities_from_symds_to_app.sql: |
    
    BEGIN;
    
    ALTER TABLE location_app.fr_cities
        DISABLE TRIGGER trg_sync_fr_cities_app_to_symds;
    
    INSERT INTO location_app.fr_cities (id, region_code, dept_code, arrond_code, insee_code, alt_names,
                                        name_ascii, country_code, geoname_id, latitude, longitude, name, population)
    SELECT id, region_code, dept_code, arrond_code, insee_code, alt_names,
           name_ascii, country_code, geoname_id, latitude, longitude, name, population FROM symds_location.fr_cities
    ON CONFLICT (id) DO NOTHING;
    
    ALTER TABLE location_app.fr_cities
        ENABLE TRIGGER trg_sync_fr_cities_app_to_symds;
    
    COMMIT;
        
    SELECT COUNT(*) as number_of_cities FROM symds_location.fr_cities
