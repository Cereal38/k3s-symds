apiVersion: v1
kind: ConfigMap
metadata:
  name: location-sql-script
  namespace: default
data:
  00_check_db_ready.sql: |
    \set ON_ERROR_STOP on
    
    -- ============================================================
    -- Configuration
    -- ============================================================
    \set schema_name   symds_location
    \set role_name     location
    \set node_id       'location-002'
    \set timeout_secs  1800 -- TODO: Change timeout
    
    -- ============================================================
    -- Checks 1 & 2: schema and sym_node_security exist
    -- ============================================================
    DO $$
    DECLARE
    v_schema TEXT := 'symds_location';
    BEGIN
    IF NOT EXISTS (SELECT 1 FROM pg_namespace WHERE nspname = v_schema) THEN
    RAISE EXCEPTION 'Schema % does not exist', v_schema;
    END IF;
    RAISE NOTICE '[1/6] OK - schema % exists', v_schema;
    
    IF to_regclass(quote_ident(v_schema) || '.sym_node_security') IS NULL THEN
    RAISE EXCEPTION 'Table %.sym_node_security does not exist', v_schema;
    END IF;
    RAISE NOTICE '[2/6] OK - %.sym_node_security exists', v_schema;
    END $$;
    
    -- ============================================================
    -- Check 3: wait for initial_load_end_time
    -- ============================================================
    DO $$
    DECLARE
    v_node_id  TEXT      := '002';
    v_deadline TIMESTAMP := clock_timestamp() + INTERVAL '1800 seconds'; -- TODO: Change timeout
    v_done     BOOLEAN;
    v_errors   INT;
    BEGIN
    LOOP
    SELECT initial_load_end_time IS NOT NULL
    INTO v_done
    FROM symds_location.sym_node_security
    WHERE node_id = v_node_id;
    
    IF NOT FOUND THEN
    RAISE EXCEPTION 'No sym_node_security row for node %', v_node_id;
    END IF;
    
    EXIT WHEN v_done;
    
    -- fail fast instead of burning the whole timeout on a broken load
    IF to_regclass('symds_location.sym_incoming_batch') IS NOT NULL THEN
    SELECT count(*) INTO v_errors
    FROM symds_location.sym_incoming_batch
    WHERE status = 'ER';
    IF v_errors > 0 THEN
    RAISE EXCEPTION 'Initial load has % batch(es) in ER status', v_errors;
    END IF;
    END IF;
    
    IF clock_timestamp() > v_deadline THEN
    RAISE EXCEPTION 'Timed out waiting for initial load of node %', v_node_id;
    END IF;
    
    PERFORM pg_sleep(10);
    END LOOP;
    
    RAISE NOTICE '[3/6] OK - initial load finished for node %', v_node_id;
    END $$;
    
    -- ============================================================
    -- Checks 4, 5, 6: role, expected tables, ownership
    -- ============================================================
    DO $$
    DECLARE
    v_schema   TEXT   := 'symds_location';
    v_role     TEXT   := 'location';
    v_expected TEXT[] := ARRAY['fr_cities'];
    v_tbl      TEXT;
    v_missing  TEXT[] := '{}';
    v_bad      TEXT[] := '{}';
    v_owner    TEXT;
    BEGIN
    -- 4
    IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = v_role) THEN
    RAISE EXCEPTION 'Role % does not exist', v_role;
    END IF;
    RAISE NOTICE '[4/6] OK - role % exists', v_role;
    
    -- 5
    FOREACH v_tbl IN ARRAY v_expected LOOP
    IF to_regclass(quote_ident(v_schema) || '.' || quote_ident(v_tbl)) IS NULL THEN
    v_missing := v_missing || v_tbl;
    END IF;
    END LOOP;
    
    IF cardinality(v_missing) > 0 THEN
    RAISE EXCEPTION 'Missing table(s) in %: %', v_schema, array_to_string(v_missing, ', ');
    END IF;
    RAISE NOTICE '[ 5/6 ] OK - all % expected table(s) present', cardinality(v_expected);
                                            
                                            -- 6
                                            FOREACH v_tbl IN ARRAY v_expected LOOP
                                            SELECT pg_get_userbyid(c.relowner)
                                            INTO v_owner
                                            FROM pg_class c
                                            JOIN pg_namespace n ON n.oid = c.relnamespace
                                            WHERE n.nspname = v_schema AND c.relname = v_tbl;
                                            
                                            IF v_owner <> v_role THEN
                                            v_bad := v_bad || format('%s (owner=%s)', v_tbl, v_owner);
                                            END IF;
                                            END LOOP;
                                            
                                            IF cardinality(v_bad) > 0 THEN
    RAISE EXCEPTION 'Table(s) not owned by %: %', v_role, array_to_string(v_bad, ', ');
    END IF;
    RAISE NOTICE '[ 6/6 ] OK - all expected table(s) owned by %', v_role;
                                              END $$;
                                              
                                              -- ============================================================
                                              -- Everything validated below this line
                                              -- ============================================================
                                              -- CREATE TRIGGER ...

  01_setup_user_config.sql: |
    -- Create the role location_app
    DO
    $$
    BEGIN
        IF
    NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'location_app') THEN
    CREATE ROLE location_app LOGIN PASSWORD 'location_app';
    END IF;
    END
    $$;

  
    -- Create schema location_app and allow it to connect to the location dabase
    CREATE SCHEMA IF NOT EXISTS location_app AUTHORIZATION location_app;
    GRANT
    CONNECT
    ON DATABASE location TO location_app;
    
    -- Give access to location_app to the symds schema (for everything created before this script)
    GRANT USAGE ON SCHEMA
    symds_location TO location_app;
    GRANT
    SELECT,
    INSERT
    ,
    UPDATE,
    DELETE
    ON ALL TABLES IN SCHEMA symds_location TO location_app;
    GRANT
    USAGE,
    SELECT
    ON ALL SEQUENCES IN SCHEMA symds_location TO location_app;
    
    -- Give access to location_app to the symds schema (for everything created after this script)
    ALTER
    DEFAULT PRIVILEGES FOR ROLE location IN SCHEMA symds_location
        GRANT
    SELECT,
    INSERT
    ,
    UPDATE,
    DELETE
    ON TABLES TO location_app;
    ALTER
    DEFAULT PRIVILEGES FOR ROLE location IN SCHEMA symds_location
        GRANT USAGE,
    SELECT
    ON SEQUENCES TO location_app;

  02_create_fr_cities.sql: |
    
    CREATE TABLE IF NOT EXISTS location_app.fr_cities (
      id BIGINT PRIMARY KEY,
      region_code VARCHAR(10),
      dept_code VARCHAR(10),
      arrond_code VARCHAR(10),
      insee_code VARCHAR(10),
      alt_names VARCHAR(2000),
      name_ascii VARCHAR(200),
      country_code VARCHAR(2),
      geoname_id BIGINT,
      latitude NUMERIC(9, 6),
      longitude NUMERIC(9, 6),
      name VARCHAR(200),
      population INTEGER
    );
        
    ALTER TABLE location_app.fr_cities OWNER TO location_app;

  03_sync_fr_cities_symds_to_app.sql: |

    DROP TRIGGER IF EXISTS trg_sync_fr_cities_symds_to_app ON symds_location.fr_cities;

    CREATE
    OR REPLACE FUNCTION location_app.sync_fr_cities_symds_to_app()
    RETURNS trigger
    LANGUAGE plpgsql
    SECURITY DEFINER
    SET search_path = location_app, pg_catalog
    AS $$
    BEGIN
        /*
         * Loop guard: the peer trigger sets this flag while it is
         * propagating a row, so we must not propagate it back.
         */
        IF
    coalesce(current_setting('symds.sync_in_progress', true), 'off') = 'on' THEN
            IF TG_OP = 'DELETE' THEN RETURN OLD;
    ELSE RETURN NEW;
    END IF;
    END IF;

        PERFORM
    set_config('symds.sync_in_progress', 'on', true);  -- transaction-local

        IF
    TG_OP = 'DELETE' THEN
    DELETE
    FROM location_app.fr_cities
    WHERE id = OLD.id;
    
    PERFORM
    set_config('symds.sync_in_progress', 'off', true);
    RETURN OLD;
    END IF;

        IF
    TG_OP = 'UPDATE' THEN
    UPDATE location_app.fr_cities
    SET 
        region_code = NEW.region_code,
        dept_code = NEW.dept_code,
        arrond_code = NEW.arrond_code,
        insee_code = NEW.insee_code,
        alt_names = NEW.alt_names,
        name_ascii = NEW.name_ascii,
        country_code = NEW.country_code,
        geoname_id = NEW.geoname_id,
        latitude = NEW.latitude,
        longitude = NEW.longitude,
        name = NEW.name,
        population = NEW.population
    WHERE id = OLD.id;
    
    IF
    NOT FOUND THEN
                INSERT INTO location_app.fr_cities (
                    id, region_code, dept_code, arrond_code, insee_code, alt_names, name_ascii, country_code, geoname_id, latitude, longitude, name, population)
                VALUES (NEW.id, NEW.region_code, NEW.dept_code, NEW.arrond_code, NEW.insee_code, NEW.alt_names, NEW.name_ascii, NEW.country_code, NEW.geoname_id, NEW.latitude, NEW.longitude, NEW.name, NEW.population);
    END IF;

            PERFORM
    set_config('symds.sync_in_progress', 'off', true);
    RETURN NEW;
    END IF;

        -- TG_OP = 'INSERT'
    INSERT INTO location_app.fr_cities (id, region_code, dept_code, arrond_code, insee_code, alt_names, name_ascii, country_code, geoname_id, latitude, longitude, name, population)
    VALUES (NEW.id, NEW.region_code, NEW.dept_code, NEW.arrond_code, NEW.insee_code, NEW.alt_names, NEW.name_ascii, NEW.country_code, NEW.geoname_id, NEW.latitude, NEW.longitude, NEW.name, NEW.population);
    
    PERFORM
    set_config('symds.sync_in_progress', 'off', true);
    RETURN NEW;
    END;
    $$;

    ALTER FUNCTION location_app.sync_fr_cities_symds_to_app()
        OWNER TO location_app;

    CREATE TRIGGER trg_sync_fr_cities_symds_to_app
        AFTER INSERT OR
    UPDATE OR
    DELETE
    ON symds_location.fr_cities
        FOR EACH ROW
        EXECUTE FUNCTION location_app.sync_fr_cities_symds_to_app();

    SELECT * FROM symds_location.fr_cities

  04_sync_fr_cities_app_to_symds.sql: |

    DROP TRIGGER IF EXISTS trg_sync_fr_cities_app_to_symds ON location_app.fr_cities;

    CREATE
