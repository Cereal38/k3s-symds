apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: identity-pg
  namespace: default
spec:
  instances: 1

  imageName: ghcr.io/cloudnative-pg/postgresql:15

  storage:
    size: 1Gi

  bootstrap:
    initdb:
      database: identity
      owner: identity
      # Fixes the app user's password to 'identity' (see k8s/identity-pg-app-secret.yaml)
      # instead of letting CNPG generate a random one every cluster creation.
      secret:
        name: identity-pg-app

      # The engine connects with currentSchema=symds_identity, which selects a schema
      # but never creates it. Without this the sym_* tables cannot be created.
      postInitApplicationSQL:
        - CREATE SCHEMA IF NOT EXISTS symds_identity AUTHORIZATION identity;

  enableSuperuserAccess: true
