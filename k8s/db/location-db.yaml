apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: location-pg
  namespace: default
spec:
  instances: 1

  imageName: ghcr.io/cloudnative-pg/postgresql:15

  storage:
    size: 1Gi

  bootstrap:
    initdb:
      database: location
      owner: location
      secret:
        name: location-pg-app

      postInitApplicationSQL:
        - CREATE SCHEMA IF NOT EXISTS symds_location AUTHORIZATION location;

  enableSuperuserAccess: true
